name: Release Verification

# appcast.json silently rots when a release is published but the recorded hash
# is not refreshed. Bob refuses to install on a hash mismatch, so the drift only
# reaches users. This job fails loudly instead.
#
# Triggering on appcast.json changes, rather than on tag pushes, is deliberate:
# `release:publish` creates the tag before appcast.json is committed, so a tag
# push would still read the previous version from main and verify the wrong entry.
#
# The release artifact itself cannot be built in CI: it embeds the private
# OALD/roots data packs. Build and publish locally with:
#   npm run build:release && npm run release:publish

on:
  push:
    branches: [main]
    paths: ["appcast.json"]
  workflow_dispatch:

jobs:
  verify-asset:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify published asset against appcast.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/verify_appcast_asset.mjs
